[package]
name = "voicekey-remote"
version.workspace = true
edition.workspace = true

# 手机接入层：只依赖 core，不依赖 tauri，便于单独测试
[dependencies]
voicekey-core = { path = "../core" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webrtc = "0.17.2"
opus-sys = { path = "../opus-sys" }
