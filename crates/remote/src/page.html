<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f7f5">
<title>VoiceKey</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    background: #f7f7f4; color: #1a1915;
    font: 15px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: none;
  }
  #app { height: 100%; display: flex; flex-direction: column; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); }
  #bar { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6b6b66; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #c9c9c4; }
  #dot.on { background: #1d9e75; }
  #hint { margin-left: auto; }
  #text { flex: 1; margin: 16px 0; padding: 16px; border-radius: 14px; background: #fff;
          border: 1px solid rgba(24,22,16,.10); overflow-y: auto; line-height: 1.7; white-space: pre-wrap;
          -webkit-user-select: text; user-select: text; touch-action: pan-y; }
  #text .ph { color: #b6b6b0; }
  #rows { display: flex; flex-direction: column; gap: 8px; max-height: 30vh; overflow-y: auto;
          margin-bottom: 12px; touch-action: pan-y; }
  #rows.hide { display: none; }
  .row { display: flex; align-items: center; gap: 10px; padding: 11px 13px; background: #fff;
         border: 1px solid rgba(24,22,16,.10); border-radius: 12px; transition: border-color .12s ease, background .12s ease; }
  .row .name { font-size: 13px; font-weight: 600; color: #222; flex: none; }
  .row .txt { flex: 1; font-size: 13px; color: #6b6b66; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .st { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #c9c9c4; }
  .row.listen .st { background: #d9552b; animation: pulse 1s ease-in-out infinite; }
  .row.final .st { background: #1d9e75; }
  .row.error .st { background: #b34040; }
  .row.sel { border-color: #1a1915; background: #faf9f6; }
  .row.shake { animation: shake .4s ease; }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
  #talk { height: 22vh; min-height: 132px; border: none; border-radius: 18px; background: #1a1915; color: #fff;
          font-size: 19px; letter-spacing: 1px; display: flex; align-items: center; justify-content: center;
          flex-direction: column; gap: 6px; touch-action: none; }
  #talk.rec { background: #d9552b; }
  #talk small { font-size: 12px; opacity: .7; letter-spacing: 0; }
  #ctl { display: flex; gap: 12px; height: 22vh; min-height: 132px; }
  #talk { flex: 1; height: auto; min-height: 0; }
  #del { width: 92px; flex: none; border-radius: 18px; border: 1px solid rgba(24,22,16,.12); background: #fff; color: #55554f;
         display: flex; align-items: center; justify-content: center; touch-action: none;
         transition: transform .06s ease, background .12s ease, opacity .12s ease; }
  #del:active { transform: scale(.96); background: #efefeb; }
  #del.off { opacity: .35; pointer-events: none; }
  #gate { position: fixed; inset: 0; background: #f7f7f4; display: flex; align-items: center;
          justify-content: center; flex-direction: column; gap: 16px; padding: 32px; text-align: center; }
  #gate p { margin: 0; color: #6b6b66; font-size: 14px; line-height: 1.7; max-width: 300px; }
  #gate button { border: none; background: #1a1915; color: #fff; font-size: 17px; padding: 16px 40px; border-radius: 999px; }
  #gate.hide { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="bar"><span id="dot"></span><span id="state">未连接</span><span id="hint"></span></div>
  <div id="text"><span class="ph">按住下方按钮说话，电脑端会收到音频。</span></div>
  <div id="note" class="hide"></div>
  <div id="rows" class="hide"></div>
  <div id="ctl">
    <button id="del" aria-label="退格">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 5H9.6a2 2 0 0 0-1.6.8L3.2 11.2a1.3 1.3 0 0 0 0 1.6l4.8 5.4a2 2 0 0 0 1.6.8H20a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/>
        <path d="M12 9.5l5 5M17 9.5l-5 5"/>
      </svg>
    </button>
    <button id="talk">按住说话<small>松手结束</small></button>
  </div>
</div>

<div id="gate">
  <p>需要允许麦克风。<br>这个页面只在你按住时采集声音。</p>
  <button id="enable">启用麦克风</button>
</div>

<script>
const token = new URLSearchParams(location.search).get('t') || '';
const RATE = 16000, FRAME = 320;
const $ = (id) => document.getElementById(id);
const textEl = $('text'), talkEl = $('talk'), stateEl = $('state'), dotEl = $('dot'), hintEl = $('hint'), rowsEl = $('rows');
const noteEl = $('note');
let noteTimer = 0;

// 电脑侧的原因要说给手机上的人听：他看不到桌面，只能靠这一行判断该怎么办
function note(text) {
  noteEl.textContent = text;
  noteEl.classList.remove('hide');
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => noteEl.classList.add('hide'), 7000);
}

let ws = null, ctx = null, node = null, stream = null, track = null;
let kicked = false;
let pc = null, rtcReady = false, iceServers = [], preferPcm = false;
let active = false, sent = 0, t0 = 0, timer = 0;
let resPos = 0, inRate = RATE, pcm = [];

function setState(text, ok) { stateEl.textContent = text; dotEl.className = ok ? 'on' : ''; }

// ---- 多渠道候选：服务端发 rows，点一条发 commit，选中的字由电脑上屏 ----
const CH_NAME = { doubao: '豆包', wetype: '微信', qwen: '千问', baidu: '百度', sogou: '搜狗',
                  iflytek: '讯飞', chatterfly: 'Chatterfly', wetypeoffline: '微信离线', all: '多渠道' };
function esc(s) { return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function renderRows(m) {
  if (!m || !m.rows || !m.rows.length) { rowsEl.classList.add('hide'); rowsEl.innerHTML = ''; return; }
  rowsEl.classList.remove('hide');
  rowsEl.innerHTML = m.rows.map((r, i) =>
    `<div class="row ${r.state}${i === m.sel ? ' sel' : ''}" data-ch="${r.channel}">` +
      `<span class="name">${esc(CH_NAME[r.channel] || r.channel)}</span>` +
      `<span class="txt">${esc(r.text) || '&nbsp;'}</span><span class="st"></span>` +
    `</div>`
  ).join('');
}

rowsEl.addEventListener('pointerup', (e) => {
  const el = e.target.closest('.row');
  if (el && ws && ws.readyState === 1) ws.send(JSON.stringify({ op: 'commit', channel: el.dataset.ch }));
});

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?t=${encodeURIComponent(token)}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => setState('已连接', true);
  ws.onclose = () => {
    rtcReady = false;
    if (kicked) { setState('电脑已断开，请重新扫码', false); return; }
    setState('连接断开，重试中', false);
    setTimeout(connect, 1200);
  };
  ws.onerror = () => setState('连接出错', false);
  ws.onmessage = async (event) => {
    let msg; try { msg = JSON.parse(event.data); } catch { return; }
    if (msg.type === 'hello') {
      iceServers = (msg.ice || []).map((u) => ({ urls: u }));
      if (stream) await setupRtc();
    } else if (msg.type === 'answer') {
      await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
    } else if (msg.type === 'partial') {
      textEl.textContent = msg.text;
    } else if (msg.type === 'stats') {
      hintEl.textContent = msg.packets
        ? `${msg.packets} 包 · ${msg.seconds.toFixed(1)} 秒 · 丢包 ${msg.loss.toFixed(1)}%`
        : '';
    } else if (msg.type === 'busy') {
      textEl.textContent = '另一台设备正在说话，松手后重按';
    } else if (msg.type === 'prefer') {
      // 服务端判定这条链路丢包太多，后面的句子改走回落
      preferPcm = true;
      setState('回落通道', false);
      note('这条链路丢包偏多（' + (msg.reason || '') + '），已切到回落通道，后面的句子会稍慢一点但更准。');
    } else if (msg.type === 'final') {
      textEl.textContent = msg.text || '（没有识别到内容）';
      // 提交了某条候选或单渠道定稿：候选列表的使命结束
      rowsEl.classList.add('hide');
    } else if (msg.type === 'rows') {
      renderRows(msg.model);
    } else if (msg.type === 'shake') {
      const el = rowsEl.children[msg.row];
      if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    } else if (msg.type === 'kicked') {
      kicked = true;
      textEl.textContent = '电脑端已断开连接，请重新扫码。';
      rowsEl.classList.add('hide');
      setState('已断开', false);
      ws.close();
    } else if (msg.type === 'notice') {
      note(msg.text);
    } else if (msg.type === 'error') {
      textEl.textContent = '出错（' + msg.stage + '）：' + msg.message;
      rowsEl.classList.add('hide');
    }
  };
}
connect();

async function startAudio() {
  stream = await navigator.mediaDevices.getUserMedia({
    audio: {
      channelCount: 1,
      // 与 PC 端裸麦保持一致：浏览器默认的降噪会吃掉小声说话的开头
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: true,
    },
  });
  track = stream.getAudioTracks()[0];
  track.enabled = false;
  try { ctx = new AudioContext({ sampleRate: RATE }); }
  catch { ctx = new AudioContext(); }
  if (ctx.state === 'suspended') await ctx.resume();
  inRate = ctx.sampleRate;

  const code = `
    class Tap extends AudioWorkletProcessor {
      process(inputs) {
        const ch = inputs[0] && inputs[0][0];
        if (ch) this.port.postMessage(new Float32Array(ch));
        return true;
      }
    }
    registerProcessor('tap', Tap);`;
  const url = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
  await ctx.audioWorklet.addModule(url);

  node = new AudioWorkletNode(ctx, 'tap');
  node.port.onmessage = (e) => feed(e.data);
  const src = ctx.createMediaStreamSource(stream);
  const mute = ctx.createGain();
  mute.gain.value = 0;
  src.connect(node).connect(mute).connect(ctx.destination);

  if (iceServers.length) await setupRtc();
}

// 页面加载即建连：ICE 收集与 DTLS 握手要几百毫秒，不能等按下那一刻再做
async function setupRtc() {
  if (pc || !stream) return;
  try {
    pc = new RTCPeerConnection({ iceServers });
    pc.addTrack(track, stream);
    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      rtcReady = s === 'connected';
      if (s === 'connected') setState('WebRTC 已连接', true);
      if (s === 'failed' || s === 'disconnected') { rtcReady = false; setState('WebRTC 断开，改用回落通道', false); }
    };
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise((resolve) => {
      if (pc.iceGatheringState === 'complete') return resolve();
      const done = () => { if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', done); resolve(); } };
      pc.addEventListener('icegatheringstatechange', done);
      setTimeout(resolve, 3000);
    });
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ op: 'offer', sdp: pc.localDescription.sdp }));
    setState('正在建立 WebRTC', false);
  } catch (e) {
    textEl.textContent = 'WebRTC 建立失败：' + (e && e.message ? e.message : e);
  }
}

// 本次按住走哪条路：WebRTC 可用且没被判定为不可靠时才用它
function useRtc() { return rtcReady && !preferPcm; }

// 回落路径专用：归一到 16k（整数倍取平均，其余线性插值）
function feed(input) {
  if (!active || useRtc()) return;
  let out;
  if (inRate === RATE) {
    out = input;
  } else {
    out = [];
    const step = inRate / RATE;
    while (resPos + 1 < input.length) {
      const i = Math.floor(resPos), f = resPos - i;
      out.push(input[i] * (1 - f) + input[i + 1] * f);
      resPos += step;
    }
    resPos -= input.length;
  }
  for (let i = 0; i < out.length; i++) {
    const s = Math.max(-1, Math.min(1, out[i]));
    pcm.push(s < 0 ? s * 0x8000 : s * 0x7fff);
  }
  while (pcm.length >= FRAME) {
    const chunk = pcm.slice(0, FRAME);
    pcm = pcm.slice(FRAME);
    const buf = new ArrayBuffer(FRAME * 2);
    const view = new DataView(buf);
    for (let i = 0; i < FRAME; i++) view.setInt16(i * 2, chunk[i], true);
    if (ws && ws.readyState === 1) { ws.send(buf); sent += FRAME * 2; }
  }
}

function begin() {
  if (!ctx || active) return;
  active = true; sent = 0; pcm = []; resPos = 0; t0 = Date.now();
  const rtc = useRtc();
  talkEl.classList.add('rec');
  delEl.classList.add('off');
  talkEl.firstChild.textContent = '松手结束';
  hintEl.textContent = rtc ? 'WebRTC' : '回落通道';
  timer = setInterval(() => {
    hintEl.textContent = (useRtc() ? 'WebRTC · ' : '回落 · ') + ((Date.now() - t0) / 1000).toFixed(1) + ' 秒';
  }, 100);
  if (rtc && track) track.enabled = true;
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ op: 'start' }));
}

function end() {
  if (!active) return;
  active = false;
  clearInterval(timer);
  if (track) track.enabled = false;
  talkEl.classList.remove('rec');
  delEl.classList.remove('off');
  talkEl.firstChild.textContent = '按住说话';
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ op: 'stop' }));
}

$('enable').onclick = async () => {
  try {
    await startAudio();
    $('gate').classList.add('hide');
  } catch (e) {
    $('gate').querySelector('p').textContent = '麦克风打开失败：' + (e && e.message ? e.message : e);
  }
};

talkEl.addEventListener('pointerdown', (e) => { e.preventDefault(); begin(); });
talkEl.addEventListener('pointerup', (e) => { e.preventDefault(); end(); });
talkEl.addEventListener('pointercancel', () => end());
talkEl.addEventListener('pointerleave', () => end());
talkEl.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('blur', () => end());
document.addEventListener('visibilitychange', () => { if (document.hidden) end(); });

// 退格：点一下删 1 个字，按住 0.4 秒后连删。往电脑的前台窗口发真实退格键
const delEl = $('del');
let delDelay = 0, delRepeat = 0;
function delOnce() {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ op: 'backspace', n: 1 }));
}
delEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (active) return;
  delOnce();
  delDelay = setTimeout(() => { delRepeat = setInterval(delOnce, 80); }, 420);
});
function delStop() { clearTimeout(delDelay); clearInterval(delRepeat); }
delEl.addEventListener('pointerup', delStop);
delEl.addEventListener('pointercancel', delStop);
delEl.addEventListener('pointerleave', delStop);
delEl.addEventListener('contextmenu', (e) => e.preventDefault());
</script>
</body>
</html>
