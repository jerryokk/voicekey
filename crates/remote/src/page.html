<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f7f4">
<title>VoiceKey</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f7f4;
    --ink: #1a1915;
    --muted: #6b6b66;
    --faint: #b6b6b0;
    --line: rgba(24, 22, 16, .10);
    --brand: #d9552b;
    --red: #b34040;
    --green: #1d9e75;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; border: none; background: none; padding: 0; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    background: var(--bg); color: var(--ink);
    font: 15px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: none;
  }
  .hide { display: none !important; }

  #app {
    height: 100%; display: flex; flex-direction: column; gap: 12px;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  }

  /* 顶栏：状态点 + 状态，右侧是链路统计 */
  #bar { display: flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: .2px; }
  #dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #c9c9c4; transition: background .2s, box-shadow .2s; }
  #dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(29, 158, 117, .13); }
  #state { color: #3d3d38; font-weight: 500; }
  #hint { margin-left: auto; font-size: 11.5px; color: #9b9b95; font-variant-numeric: tabular-nums; }

  /* 结果卡片：录音与取消两个状态都换描边，拇指挡住按钮时也看得出处于哪一态 */
  #card {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    padding: 16px 16px 10px; border-radius: 18px; background: #fff;
    border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(24, 22, 16, .03), 0 12px 28px -22px rgba(24, 22, 16, .45);
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  #card.rec { border-color: rgba(217, 85, 43, .42); box-shadow: 0 1px 2px rgba(217, 85, 43, .06), 0 12px 28px -20px rgba(217, 85, 43, .5); }
  #card.arm { border-color: rgba(179, 64, 64, .5); box-shadow: 0 1px 2px rgba(179, 64, 64, .08), 0 12px 28px -20px rgba(179, 64, 64, .5); }

  #text {
    flex: 1; min-height: 0; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    line-height: 1.75; font-size: 15.5px;
    -webkit-user-select: text; user-select: text; touch-action: pan-y;
  }
  #text.ph { color: var(--faint); }

  #foot { display: flex; justify-content: flex-end; align-items: center; min-height: 32px; padding-top: 6px; }
  #undo {
    display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px 6px 10px;
    border-radius: 999px; border: 1px solid var(--line); background: #faf9f6; color: #55554f;
    font-size: 12.5px; transition: transform .08s ease, background .15s ease;
  }
  #undo:active { transform: scale(.96); background: #f0efea; }
  #undo svg { width: 13px; height: 13px; }

  /* 提示条：取消结果、切换通道、没听清这类一句话说明都走这里 */
  #note {
    padding: 10px 13px; border-radius: 12px; font-size: 13px; line-height: 1.6;
    background: #fbf3ee; border: 1px solid rgba(217, 85, 43, .16); color: #8a4a2c;
    animation: noteIn .22s cubic-bezier(.22, .68, .36, 1);
  }
  @keyframes noteIn { from { opacity: 0; transform: translateY(-6px); } }

  /* 系统里关了动效就只保留状态色，不要动画 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    #tip { transform: translate(-50%, 0); }
    #tip::before { opacity: var(--p); }
  }

  /* 多渠道候选 */
  #rows { display: flex; flex-direction: column; gap: 8px; max-height: 30vh; overflow-y: auto; touch-action: pan-y; }
  .row {
    display: flex; align-items: center; gap: 10px; padding: 11px 13px; background: #fff;
    border: 1px solid var(--line); border-radius: 14px;
    transition: border-color .12s ease, background .12s ease;
  }
  .row .name { flex: none; font-size: 13px; font-weight: 600; }
  .row .txt { flex: 1; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .st { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #c9c9c4; }
  .row.listen .st { background: var(--brand); animation: pulse 1s ease-in-out infinite; }
  .row.final .st { background: var(--green); }
  .row.error .st { background: var(--red); }
  .row.sel { border-color: var(--ink); background: #faf9f6; }
  .row.shake { animation: shake .4s ease; }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

  /* 底部：退格 + 按住说话 */
  #stage { position: relative; display: flex; gap: 10px; height: 21vh; min-height: 126px; max-height: 176px; }

  /* 取消指示：白底小胶囊 + 进度环。拇指盖着按钮，它浮在上方
     --p 由手指位移直接驱动：环按比例填满，胶囊随之上浮 */
  #tip {
    --p: 0; --vis: 0;
    position: absolute; left: 50%; bottom: calc(100% + 12px);
    display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px 5px 5px;
    border-radius: 999px; background: #fff; color: #3d3d38;
    border: 1px solid rgba(24, 22, 16, .09);
    font-size: 12.5px; letter-spacing: .3px; white-space: nowrap;
    pointer-events: none; will-change: transform, opacity;
    opacity: calc(var(--vis) * (.8 + var(--p) * .2));
    transform: translate(-50%, calc(8px - var(--p) * 15px)) scale(calc(.96 + var(--p) * .04));
    transition: opacity .18s ease, transform .18s cubic-bezier(.22, .68, .36, 1), color .15s ease, border-color .15s ease;
    /* 背景色描一圈：浮在卡片边缘上也不会糊成一块 */
    box-shadow: 0 0 0 3px var(--bg), 0 10px 24px -16px rgba(24, 22, 16, .55);
  }
  #tip.show { --vis: 1; }
  #tip.arm { color: var(--red); border-color: rgba(179, 64, 64, .3); }

  /* 进度环：conic-gradient 按 --p 填色，中间挖空后放一个会转身的箭头 */
  #tip .ring {
    position: relative; flex: none; width: 24px; height: 24px; border-radius: 50%;
    background: conic-gradient(var(--red) calc(var(--p) * 360deg), rgba(24, 22, 16, .13) 0);
    display: grid; place-items: center;
  }
  #tip .ring::before {
    content: ''; position: absolute; inset: 3px; border-radius: 50%; background: #fff;
  }
  #tip .ring svg {
    position: relative; z-index: 1; width: 12px; height: 12px;
    transform: rotate(calc(var(--p) * 180deg));
    transition: transform .18s cubic-bezier(.22, .68, .36, 1);
  }

  #del {
    flex: none; width: 84px; border-radius: 20px; border: 1px solid rgba(24, 22, 16, .12);
    background: #fff; color: #55554f; display: flex; align-items: center; justify-content: center;
    transition: transform .07s ease, background .15s ease, opacity .15s ease;
  }
  #del:active { transform: scale(.96); background: #efefeb; }
  #del.off { opacity: .3; pointer-events: none; }

  #talk {
    position: relative; flex: 1; border-radius: 20px; background: var(--ink); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    overflow: hidden;
    transition: background .2s ease, transform .14s cubic-bezier(.22, .68, .36, 1), box-shadow .24s ease;
  }
  #talk:active:not(.arm) { transform: scale(.985); }
  #talk.rec { background: var(--brand); box-shadow: 0 14px 28px -18px rgba(217, 85, 43, .95); }
  #talk.arm { background: var(--red); transform: scale(.972); box-shadow: 0 8px 20px -14px rgba(179, 64, 64, .95); }
  /* 文字与波形叠在同一格里，切换时位置不跳 */
  #stack { display: grid; place-items: center; min-height: 30px; }
  #stack > * { grid-area: 1 / 1; }
  #tlabel {
    font-size: 18px; font-weight: 500; letter-spacing: 1.5px;
    transition: opacity .14s ease, transform .2s cubic-bezier(.22, .68, .36, 1);
  }
  #tsub { font-size: 11.5px; opacity: .62; letter-spacing: .4px; transition: opacity .15s ease; }
  #wave {
    display: flex; align-items: center; gap: 4px; height: 30px;
    opacity: 0; pointer-events: none; transition: opacity .16s ease;
  }
  /* 录音时文字让位给波形：柱子高度跟真实电平走 */
  #talk.rec:not(.arm) #tlabel { opacity: 0; transform: translateY(-6px); }
  #talk.rec:not(.arm) #wave { opacity: 1; }
  #wave i {
    display: block; width: 3px; height: 4px; border-radius: 2px;
    background: rgba(255, 255, 255, .92);
  }

  /* 麦克风授权页 */
  #gate {
    position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center;
    justify-content: center; flex-direction: column; gap: 18px; padding: 36px; text-align: center;
  }
  #gate .mark {
    width: 46px; height: 46px; border-radius: 14px; background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  #gate .mark svg { width: 24px; height: 24px; }
  #gate p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; max-width: 300px; }
  #gate button { background: var(--ink); color: #fff; font-size: 16px; padding: 15px 38px; border-radius: 999px; letter-spacing: .5px; }
</style>
</head>
<body>
<div id="app">
  <div id="bar"><span id="dot"></span><span id="state">未连接</span><span id="hint"></span></div>

  <div id="card">
    <div id="text" class="ph">按住下方按钮说话，电脑端会收到音频。</div>
    <div id="foot">
      <button id="undo" class="hide" aria-label="撤回上一句">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h11a5 5 0 0 1 0 10H8"/><path d="M7 4L3 8l4 4"/></svg>
        撤回
      </button>
    </div>
  </div>

  <div id="note" class="hide"></div>
  <div id="rows" class="hide"></div>

  <div id="stage">
    <div id="tip">
      <span class="ring">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
             stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg>
      </span>
      <span id="tiptext">上滑取消</span>
    </div>
    <button id="del" aria-label="退格">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 5H9.6a2 2 0 0 0-1.6.8L3.2 11.2a1.3 1.3 0 0 0 0 1.6l4.8 5.4a2 2 0 0 0 1.6.8H20a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/>
        <path d="M12 9.5l5 5M17 9.5l-5 5"/>
      </svg>
    </button>
    <button id="talk">
      <span id="stack">
        <span id="tlabel">按住说话</span>
        <span id="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      </span>
      <span id="tsub">上滑可取消</span>
    </button>
  </div>
</div>

<div id="gate">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>
    </svg>
  </div>
  <p>需要允许麦克风。<br>这个页面只在你按住时采集声音。</p>
  <button id="enable">启用麦克风</button>
</div>

<script>
const token = new URLSearchParams(location.search).get('t') || '';
const RATE = 16000, FRAME = 320;
const $ = (id) => document.getElementById(id);
const textEl = $('text'), talkEl = $('talk'), stateEl = $('state'), dotEl = $('dot'), hintEl = $('hint'), rowsEl = $('rows');
const cardEl = $('card'), noteEl = $('note'), undoEl = $('undo'), tipEl = $('tip'), tipTextEl = $('tiptext');
const labelEl = $('tlabel'), subEl = $('tsub');
const delEl = $('del');
let noteTimer = 0, undoTimer = 0;

// ---- 界面三态：待录 / 录音 / 已滑入取消区。颜色与文案都跟着走，别让用户猜 ----
function setPhase(phase) {
  const rec = phase !== 'idle';
  const arm = phase === 'arm';
  talkEl.classList.toggle('rec', rec);
  talkEl.classList.toggle('arm', arm);
  cardEl.classList.toggle('rec', phase === 'rec');
  cardEl.classList.toggle('arm', arm);
  tipEl.classList.toggle('show', rec);
  tipEl.classList.toggle('arm', arm);
  tipTextEl.textContent = arm ? '松开，取消这一句' : '上滑取消';
  labelEl.textContent = arm ? '松开取消' : rec ? '松手结束' : '按住说话';
  subEl.textContent = arm ? '这一句丢弃' : rec ? '松手结束' : '上滑可取消';
  if (!rec) setPull(0);
}

// 上滑进度：0 是刚按下，1 是已经到了取消位。--p 直接驱动提示条的位移与颜色
function setPull(p) {
  tipEl.style.setProperty('--p', Math.max(0, Math.min(1, p)).toFixed(3));
}

function setText(text, placeholder) {
  textEl.textContent = text;
  textEl.classList.toggle('ph', !!placeholder);
}

// 撤回窗口只开 6 秒：再久一点，前台窗口可能已经换了，Ctrl+Z 会撤到别的东西上
function showUndo() {
  undoEl.classList.remove('hide');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => undoEl.classList.add('hide'), 6000);
}

// 电脑侧的原因要说给手机上的人听：他看不到桌面，只能靠这一行判断该怎么办
function note(text, ms) {
  noteEl.textContent = text;
  noteEl.classList.remove('hide');
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => noteEl.classList.add('hide'), ms || 7000);
}

let ws = null, ctx = null, node = null, stream = null, track = null;
let kicked = false, busyNotice = false;
let pc = null, rtcReady = false, iceServers = [], preferPcm = false;
let active = false, sent = 0, t0 = 0, timer = 0;
let resPos = 0, inRate = RATE, pcm = [];

// 波形：worklet 每块给一个电平，rAF 把它推成柱子的高度，别在音频线程里碰 DOM
const bars = [...document.querySelectorAll('#wave i')];
const SHAPE = [.5, .8, 1, .72, 1, .84, .46];
const hs = bars.map(() => 4);
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
let level = 0, raf = 0;

function rms(buf) {
  let sum = 0, n = 0;
  for (let i = 0; i < buf.length; i += 4) { const v = buf[i]; sum += v * v; n++; }
  return Math.sqrt(sum / n);
}

function grow() {
  const amp = Math.min(1, level * 7);
  for (let i = 0; i < bars.length; i++) {
    const target = 4 + amp * 26 * SHAPE[i];
    hs[i] += (target - hs[i]) * .3;
    bars[i].style.height = hs[i].toFixed(1) + 'px';
  }
  raf = requestAnimationFrame(grow);
}

function waveOn() { if (!calm && !raf) raf = requestAnimationFrame(grow); }
function waveOff() {
  if (raf) cancelAnimationFrame(raf);
  raf = 0; level = 0;
  bars.forEach((b) => { b.style.height = '4px'; hs.fill(4); });
}
// 取消之后要还原按下之前的文字，不能让半句实时结果留在卡片里
let before = '';

function setState(text, ok) { stateEl.textContent = text; dotEl.className = ok ? 'on' : ''; }

// ---- 多渠道候选：服务端发 rows，点一条发 commit，选中的字由电脑上屏 ----
const CH_NAME = { doubao: '豆包', wetype: '微信', qwen: '千问', baidu: '百度', sogou: '搜狗',
                  iflytek: '讯飞', chatterfly: 'Chatterfly', wetypeoffline: '微信离线', all: '多渠道' };
function esc(s) { return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function renderRows(m) {
  if (!m || !m.rows || !m.rows.length) { rowsEl.classList.add('hide'); rowsEl.innerHTML = ''; return; }
  rowsEl.classList.remove('hide');
  rowsEl.innerHTML = m.rows.map((r, i) =>
    `<div class="row ${r.state}${i === m.sel ? ' sel' : ''}" data-ch="${r.channel}">` +
      `<span class="name">${esc(CH_NAME[r.channel] || r.channel)}</span>` +
      `<span class="txt">${esc(r.text) || '&nbsp;'}</span><span class="st"></span>` +
    `</div>`
  ).join('');
}

rowsEl.addEventListener('pointerup', (e) => {
  const el = e.target.closest('.row');
  if (el && ws && ws.readyState === 1) ws.send(JSON.stringify({ op: 'commit', channel: el.dataset.ch }));
});

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?t=${encodeURIComponent(token)}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => setState('已连接', true);
  ws.onclose = () => {
    rtcReady = false;
    if (kicked) { setState('电脑已断开，请重新扫码', false); return; }
    setState('连接断开，重试中', false);
    setTimeout(connect, 1200);
  };
  ws.onerror = () => setState('连接出错', false);
  ws.onmessage = async (event) => {
    let msg; try { msg = JSON.parse(event.data); } catch { return; }
    if (msg.type === 'hello') {
      iceServers = (msg.ice || []).map((u) => ({ urls: u }));
      if (stream) await setupRtc();
    } else if (msg.type === 'answer') {
      await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
    } else if (msg.type === 'partial') {
      setText(msg.text, false);
    } else if (msg.type === 'stats') {
      hintEl.textContent = msg.packets
        ? `${msg.packets} 包 · ${msg.seconds.toFixed(1)} 秒 · 丢包 ${msg.loss.toFixed(1)}%`
        : '';
    } else if (msg.type === 'started') {
      // 服务端确认这一句归我：把上一次「被别的设备占着」的提示清掉
      if (busyNotice) { busyNotice = false; setText('', true); }
      setState('录音中', true);
    } else if (msg.type === 'busy') {
      busyNotice = true;
      setText('另一台设备正在说话，松手后重按', true);
    } else if (msg.type === 'prefer') {
      // 服务端判定这条链路丢包太多，后面的句子改走回落
      preferPcm = true;
      setState('回落通道', false);
      note('这条链路丢包偏多（' + (msg.reason || '') + '），已切到回落通道，后面的句子会稍慢一点但更准。');
    } else if (msg.type === 'final') {
      setText(msg.text || '（没有识别到内容）', !msg.text);
      // 提交了某条候选或单渠道定稿：候选列表的使命结束
      rowsEl.classList.add('hide');
      // 有字才给撤回入口，空结果没什么可撤的
      if (msg.text) showUndo(); else undoEl.classList.add('hide');
    } else if (msg.type === 'rows') {
      renderRows(msg.model);
    } else if (msg.type === 'shake') {
      const el = rowsEl.children[msg.row];
      if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    } else if (msg.type === 'kicked') {
      kicked = true;
      setText('电脑端已断开连接，请重新扫码。', true);
      rowsEl.classList.add('hide');
      setState('已断开', false);
      ws.close();
    } else if (msg.type === 'notice') {
      note(msg.text);
    } else if (msg.type === 'error') {
      setText('出错（' + msg.stage + '）：' + msg.message, true);
      rowsEl.classList.add('hide');
    }
  };
}
connect();

async function startAudio() {
  stream = await navigator.mediaDevices.getUserMedia({
    audio: {
      channelCount: 1,
      // 与 PC 端裸麦保持一致：浏览器默认的降噪会吃掉小声说话的开头
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: true,
    },
  });
  track = stream.getAudioTracks()[0];
  track.enabled = false;
  try { ctx = new AudioContext({ sampleRate: RATE }); }
  catch { ctx = new AudioContext(); }
  if (ctx.state === 'suspended') await ctx.resume();
  inRate = ctx.sampleRate;

  const code = `
    class Tap extends AudioWorkletProcessor {
      process(inputs) {
        const ch = inputs[0] && inputs[0][0];
        if (ch) this.port.postMessage(new Float32Array(ch));
        return true;
      }
    }
    registerProcessor('tap', Tap);`;
  const url = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
  await ctx.audioWorklet.addModule(url);

  node = new AudioWorkletNode(ctx, 'tap');
  node.port.onmessage = (e) => { level = rms(e.data); feed(e.data); };
  const src = ctx.createMediaStreamSource(stream);
  const mute = ctx.createGain();
  mute.gain.value = 0;
  src.connect(node).connect(mute).connect(ctx.destination);

  if (iceServers.length) await setupRtc();
}

// 页面加载即建连：ICE 收集与 DTLS 握手要几百毫秒，不能等按下那一刻再做
async function setupRtc() {
  if (pc || !stream) return;
  try {
    pc = new RTCPeerConnection({ iceServers });
    pc.addTrack(track, stream);
    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      rtcReady = s === 'connected';
      if (s === 'connected') setState('WebRTC 已连接', true);
      if (s === 'failed' || s === 'disconnected') { rtcReady = false; setState('WebRTC 断开，改用回落通道', false); }
    };
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise((resolve) => {
      if (pc.iceGatheringState === 'complete') return resolve();
      const done = () => { if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', done); resolve(); } };
      pc.addEventListener('icegatheringstatechange', done);
      setTimeout(resolve, 3000);
    });
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ op: 'offer', sdp: pc.localDescription.sdp }));
    setState('正在建立 WebRTC', false);
  } catch (e) {
    setText('WebRTC 建立失败：' + (e && e.message ? e.message : e), true);
  }
}

// 本次按住走哪条路：WebRTC 可用且没被判定为不可靠时才用它
function useRtc() { return rtcReady && !preferPcm; }

// 回落路径专用：归一到 16k（整数倍取平均，其余线性插值）
function feed(input) {
  if (!active || useRtc()) return;
  let out;
  if (inRate === RATE) {
    out = input;
  } else {
    out = [];
    const step = inRate / RATE;
    while (resPos + 1 < input.length) {
      const i = Math.floor(resPos), f = resPos - i;
      out.push(input[i] * (1 - f) + input[i + 1] * f);
      resPos += step;
    }
    resPos -= input.length;
  }
  for (let i = 0; i < out.length; i++) {
    const s = Math.max(-1, Math.min(1, out[i]));
    pcm.push(s < 0 ? s * 0x8000 : s * 0x7fff);
  }
  while (pcm.length >= FRAME) {
    const chunk = pcm.slice(0, FRAME);
    pcm = pcm.slice(FRAME);
    const buf = new ArrayBuffer(FRAME * 2);
    const view = new DataView(buf);
    for (let i = 0; i < FRAME; i++) view.setInt16(i * 2, chunk[i], true);
    if (ws && ws.readyState === 1) { ws.send(buf); sent += FRAME * 2; }
  }
}

function begin() {
  if (!ctx || active) return;
  active = true; sent = 0; pcm = []; resPos = 0; t0 = Date.now();
  before = textEl.classList.contains('ph') ? '' : textEl.textContent;
  const rtc = useRtc();
  setPhase('rec');
  setPull(0);
  waveOn();
  // 录音中不给撤回入口：这一句还没定稿，撤的是上一句，容易按错
  undoEl.classList.add('hide');
  clearTimeout(undoTimer);
  delEl.classList.add('off');
  hintEl.textContent = rtc ? 'WebRTC' : '回落通道';
  timer = setInterval(() => {
    hintEl.textContent = (useRtc() ? 'WebRTC · ' : '回落 · ') + ((Date.now() - t0) / 1000).toFixed(1) + ' 秒';
  }, 100);
  if (rtc && track) track.enabled = true;
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ op: 'start' }));
}

function release() {
  if (!active) return;
  active = false;
  clearInterval(timer);
  waveOff();
  if (track) track.enabled = false;
  setPhase('idle');
  delEl.classList.remove('off');
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ op: 'stop' }));
}

// 滑进取消区再松手：这一句整段丢弃，电脑端不跑识别也不上屏
function cancel() {
  if (!active) return;
  active = false;
  clearInterval(timer);
  waveOff();
  if (track) track.enabled = false;
  setPhase('idle');
  delEl.classList.remove('off');
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ op: 'cancel' }));
  setText(before || '按住下方按钮说话，电脑端会收到音频。', !before);
  note('已取消这一句', 1600);
}

$('enable').onclick = async () => {
  try {
    await startAudio();
    $('gate').classList.add('hide');
  } catch (e) {
    $('gate').querySelector('p').textContent = '麦克风打开失败：' + (e && e.message ? e.message : e);
  }
};

undoEl.addEventListener('click', () => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ op: 'undo' }));
  undoEl.classList.add('hide');
});

// ---- 按住说话：上滑越过阈值进入取消区，滑回来可以反悔 ----
const PULL = 56, HYST = 14;
let startY = 0, armed = false;

talkEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  startY = e.clientY;
  armed = false;
  // 捕获指针，手指滑出按钮范围也继续跟手
  try { talkEl.setPointerCapture(e.pointerId); } catch {}
  begin();
});
talkEl.addEventListener('pointermove', (e) => {
  if (!active) return;
  const dy = startY - e.clientY;            // 向上为正
  setPull(dy / PULL);
  if (!armed && dy > PULL) { armed = true; setPhase('arm'); vibrate(); }
  else if (armed && dy < PULL - HYST) { armed = false; setPhase('rec'); setPull(dy / PULL); }
});
talkEl.addEventListener('pointerup', (e) => {
  e.preventDefault();
  const drop = armed;
  armed = false;
  if (drop) cancel(); else release();
});
talkEl.addEventListener('pointercancel', () => { armed = false; release(); });
talkEl.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('blur', () => { armed = false; release(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { armed = false; release(); } });

function vibrate() { if (navigator.vibrate) navigator.vibrate(8); }

// 退格：点一下删 1 个字，按住 0.4 秒后连删。往电脑的前台窗口发真实退格键
let delDelay = 0, delRepeat = 0;
function delOnce() {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ op: 'backspace', n: 1 }));
}
delEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (active) return;
  delOnce();
  delDelay = setTimeout(() => { delRepeat = setInterval(delOnce, 80); }, 420);
});
function delStop() { clearTimeout(delDelay); clearInterval(delRepeat); }
delEl.addEventListener('pointerup', delStop);
delEl.addEventListener('pointercancel', delStop);
delEl.addEventListener('pointerleave', delStop);
delEl.addEventListener('contextmenu', (e) => e.preventDefault());

setPhase('idle');
</script>
</body>
