[package]
name = "voicekey-probe"
version.workspace = true
edition.workspace = true

# 不属于产品：这是一个不用手机就能验证协议层的小工具，
# 作为 workspace 成员是为了共用同一个 target 目录与 Cargo.lock。
[dependencies]
voicekey-core = { path = "../../crates/core" }
voicekey-platform = { path = "../../crates/platform" }
voicekey-remote = { path = "../../crates/remote" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
qrcode = "0.14"
