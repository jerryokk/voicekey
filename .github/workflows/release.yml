name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      # 界面是编译期嵌进 exe 的，没有 app/dist 连 voicekey 都编不过（不是测试才需要）
      - name: Frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Test
        run: cargo test --workspace --locked

  build:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || VER="0.0.0"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: cloudflared
        run: |
          mkdir -p app/src-tauri/binaries
          curl -fsSL -o app/src-tauri/binaries/cloudflared.exe \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe

      - name: Build
        working-directory: app
        run: |
          npm ci
          npx tauri build --target x86_64-pc-windows-msvc --bundles msi,nsis \
            --config "{\"version\":\"$VER\"}"

      - name: Package
        run: |
          mkdir -p dist
          B=target/x86_64-pc-windows-msvc/release
          cp $B/bundle/nsis/*-setup.exe "dist/VoiceKey-$VER-x64-setup.exe"
          cp $B/bundle/msi/*_zh-CN.msi "dist/VoiceKey-$VER-x64.msi"

          # 免安装版：exe 与 runtime/tunnel/cloudflared.exe 放在一起即可运行
          mkdir -p staging/VoiceKey/runtime/tunnel
          cp $B/voicekey.exe staging/VoiceKey/
          cp app/src-tauri/binaries/cloudflared.exe staging/VoiceKey/runtime/tunnel/
          ZIP="$(command -v 7z || echo '/c/Program Files/7-Zip/7z.exe')"
          "$ZIP" a -tzip "dist/VoiceKey-$VER-x64-portable.zip" ./staging/VoiceKey > /dev/null
          rm -rf staging

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceKey-Windows
          path: dist/*

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "VoiceKey $GITHUB_REF_NAME" --generate-notes \
            --notes "Windows 安装包（msi / exe）与免安装压缩包。装好后打开设置，用手机扫「手机接入」里的二维码，按住说话即可；按住时上滑可取消这一句。公网地址每次启动都会变，谁拿到它谁就能往这台电脑输入文字，不要外传。"
