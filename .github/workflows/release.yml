name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      # tauri-build 编译期要求资源存在
      - name: cloudflared
        run: |
          mkdir -p app/src-tauri/binaries
          curl -fsSL -o app/src-tauri/binaries/cloudflared.exe \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe

      # 界面是编译期嵌进 exe 的，没有 app/dist 连 voicekey 都编不过（不是测试才需要）
      - name: Frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Test
        run: cargo test --workspace --locked

  build:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      # 版本写在两处：根 Cargo.toml 的 workspace.package.version 与 tauri.conf.json。
      # 两处必须一致，打 tag 时 tag 也必须与之一致，任一不符直接失败
      - name: Version
        run: |
          VER=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          CARGO_VER=$(cargo metadata --no-deps --format-version 1 --locked \
            | node -p "JSON.parse(require('fs').readFileSync(0)).packages.find((p) => p.name === 'voicekey').version")
          if [[ "$CARGO_VER" != "$VER" ]]; then
            echo "根 Cargo.toml 的 $CARGO_VER 与 tauri.conf.json 的 $VER 不一致"; exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VER" ]]; then
            echo "tag $GITHUB_REF_NAME 与 tauri.conf.json 的 $VER 不一致"; exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: cloudflared
        run: |
          mkdir -p app/src-tauri/binaries
          curl -fsSL -o app/src-tauri/binaries/cloudflared.exe \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe

      - name: Build
        working-directory: app
        run: |
          npm ci
          npx tauri build --target x86_64-pc-windows-msvc --bundles msi,nsis

      - name: Package
        run: |
          mkdir -p dist
          B=target/x86_64-pc-windows-msvc/release
          cp $B/bundle/nsis/*-setup.exe "dist/VoiceKey-$VER-x64-setup.exe"
          cp $B/bundle/msi/*_zh-CN.msi "dist/VoiceKey-$VER-x64.msi"

      # 免安装包与本地 scripts/build.ps1 -Package 走同一个脚本
      - name: Portable
        shell: pwsh
        run: ./scripts/package.ps1 -Bin target/x86_64-pc-windows-msvc/release

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceKey-Windows
          path: dist/*

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "VoiceKey $GITHUB_REF_NAME" --generate-notes \
            --notes "Windows 安装包（msi / exe）与免安装压缩包。装好后左键点托盘图标，用手机扫面板里的二维码，按住说话即可；按住时上滑可取消这一句，手机上半区可当触摸板。公网地址每次启动都会变，谁拿到它谁就能往这台电脑输入文字，不要外传。"
