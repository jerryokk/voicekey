[workspace]
resolver = "2"
members = ["crates/core", "crates/opus-sys", "crates/platform", "crates/wtlocal", "crates/remote", "app/src-tauri"]

[workspace.package]
version = "1.1.0"
edition = "2021"

[profile.release]
lto = true
codegen-units = 1
strip = true

# 离线推理在 debug 构建下也需要优化，否则开发联调时慢到不可用
[profile.dev.package.voicekey-wtlocal]
opt-level = 3
