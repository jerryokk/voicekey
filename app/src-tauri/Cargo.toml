[package]
name = "voicekey"
version.workspace = true
edition.workspace = true

# custom-protocol 默认开启：前端产物（../dist）在编译期嵌进 exe，
# 这样 `cargo build` 出来的 target/debug/voicekey.exe 双击就能跑，
# 不依赖 vite 开发服务器（否则会去连 localhost:1420 报「拒绝连接」）。
# 改前端后需要先 `npm run build` 再重新编译；要热更新的开发循环用
# `npm run tauri -- dev`——CLI 会自己加 `--no-default-features`，走 devUrl。
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
voicekey-core = { path = "../../crates/core" }
voicekey-platform = { path = "../../crates/platform" }
voicekey-remote = { path = "../../crates/remote" }
voicekey-wtlocal = { path = "../../crates/wtlocal" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
md-5 = "0.10"
hex = "0.4"
qrcode = "0.14"
